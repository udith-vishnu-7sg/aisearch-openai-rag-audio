apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: voicerag-scenarios
  description: VoiceRAG application with two scenarios - native (gpt-realtime-mini
    + gpt-4.1-mini) and alternate (gpt-realtime-mini + gpt-4.1-nano) on Azure Container Apps.
  tags:
    env: prod
security:
  network:
    defaultExposure: private
  identity:
    workloadIdentity: true
secrets:
  provider: azureKeyVault
  secretRefs:
  - name: voicerag-openai-endpoint
    injectAs: env
    envVar: AZURE_OPENAI_ENDPOINT
    externalRef:
      provider: azure-keyvault
      key: voicerag-openai-endpoint
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: voicerag-openai-api-key
    injectAs: env
    envVar: AZURE_OPENAI_API_KEY
    externalRef:
      provider: azure-keyvault
      key: voicerag-openai-api-key
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-search-endpoint
    injectAs: env
    envVar: AZURE_SEARCH_ENDPOINT
    externalRef:
      provider: azure-keyvault
      key: azure-search-endpoint
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-search-api-key
    injectAs: env
    envVar: AZURE_SEARCH_API_KEY
    externalRef:
      provider: azure-keyvault
      key: azure-search-api-key
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-search-index
    injectAs: env
    envVar: AZURE_SEARCH_INDEX
    externalRef:
      provider: azure-keyvault
      key: azure-search-index
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-storage-account-name
    injectAs: env
    envVar: AZURE_STORAGE_ACCOUNT_NAME
    externalRef:
      provider: azure-keyvault
      key: azure-storage-account-name
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-storage-account-key
    injectAs: env
    envVar: AZURE_STORAGE_ACCOUNT_KEY
    externalRef:
      provider: azure-keyvault
      key: azure-storage-account-key
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-storage-container
    injectAs: env
    envVar: AZURE_STORAGE_CONTAINER
    externalRef:
      provider: azure-keyvault
      key: azure-storage-container
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: azure-storage-connection-string
    injectAs: env
    envVar: AZURE_STORAGE_CONNECTION_STRING
    externalRef:
      provider: azure-keyvault
      key: azure-storage-connection-string
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
  - name: application-insights-instrumentation-key
    injectAs: env
    envVar: APPLICATIONINSIGHTS_CONNECTION_STRING
    externalRef:
      provider: azure-keyvault
      key: application-insights-instrumentation-key
      vaultUrl: https://wdf-secret-manager.vault.azure.net/
dataSources:
  inputs:
  - name: openai-realtime-endpoint
    dsdfRef: dsdf/openai-realtime-endpoint.dsdf.yaml
  - name: openai-chat-endpoint
    dsdfRef: dsdf/openai-chat-endpoint.dsdf.yaml
  - name: ai-search-index
    dsdfRef: dsdf/ai-search-index.dsdf.yaml
  outputs: []
scenarios:
  native:
    description: 'Azure Container Apps with gpt-realtime-mini + gpt-4.1-mini: standard
      VoiceRAG deployment using Azure OpenAI for real-time voice interaction and RAG
      retrieval via Azure AI Search.'
    topology:
      components:
      - &backend
        name: voicerag-backend
        role: api
        runtime:
          platform: container-apps
          regions:
          - eastus2
          image:
            registry: uvvoiceragacr.azurecr.io
            repository: uv-voicerag-app
            tag: latest
          env:
          - name: API_HOST
            value: 0.0.0.0
          - name: PORT
            value: '8000'
          - name: LOG_LEVEL
            value: INFO
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: RUNNING_IN_PRODUCTION
            value: 'true'
          - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
            value: gpt-realtime-mini
          - name: AZURE_OPENAI_CHAT_DEPLOYMENT
            value: gpt-4.1-mini
          - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
            value: text-embedding-3-large
          - name: AZURE_OPENAI_REALTIME_VOICE_CHOICE
            value: alloy
          - name: AZURE_OPENAI_API_VERSION
            value: 2025-04-01-preview
          - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
            value: default
          - name: AZURE_SEARCH_IDENTIFIER_FIELD
            value: chunk_id
          - name: AZURE_SEARCH_CONTENT_FIELD
            value: chunk
          - name: AZURE_SEARCH_EMBEDDING_FIELD
            value: text_vector
          - name: AZURE_SEARCH_TITLE_FIELD
            value: title
          - name: AZURE_SEARCH_USE_VECTOR_QUERY
            value: 'True'
          envFromSecretRefs:
          - voicerag-openai-endpoint
          - voicerag-openai-api-key
          - azure-search-endpoint
          - azure-search-api-key
          - azure-search-index
          - azure-storage-account-name
          - azure-storage-account-key
          - azure-storage-container
          - azure-storage-connection-string
          - application-insights-instrumentation-key
          resources:
            cpu: '1'
            memory: 2Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 10
            policy:
              metric: cpu
              target: 70
        endpoints:
        - name: http
          port: 8000
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: azure-container-apps-realtime-mini
      target:
        provider: azure
        region: eastus2
        tdfRef: voicerag-azure-east
        cluster: voicerag-containerapp-aca-env
        namespace: voicerag
      identityRef: azure-managed-identity://voicerag
      secretStores:
        primary: wdf-secret-manager
      components:
      - voicerag-backend
      overrides:
        components:
          voicerag-backend:
            runtime:
              image:
                registry: uvvoiceragacr.azurecr.io
                repository: uv-voicerag-app
                tag: latest
  alternates:
  - name: azure-container-apps-gpt4-mini
    description: 'Same Azure Container Apps setup but using gpt-realtime-mini + gpt-4.1-nano
      models instead of gpt-realtime-mini + gpt-4.1-mini. Compares performance with
      a lighter chat model while keeping the same realtime voice pipeline.'
    topology:
      components:
      - name: voicerag-backend
        role: api
        runtime:
          platform: container-apps
          regions:
          - eastus2
          image:
            registry: uvvoiceragacr.azurecr.io
            repository: uv-voicerag-app
            tag: latest
          env:
          - name: API_HOST
            value: 0.0.0.0
          - name: PORT
            value: '8000'
          - name: LOG_LEVEL
            value: INFO
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: RUNNING_IN_PRODUCTION
            value: 'true'
          - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
            value: gpt-realtime-mini
          - name: AZURE_OPENAI_CHAT_DEPLOYMENT
            value: gpt-4.1-nano
          - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
            value: text-embedding-3-large
          - name: AZURE_OPENAI_REALTIME_VOICE_CHOICE
            value: alloy
          - name: AZURE_OPENAI_API_VERSION
            value: 2025-04-01-preview
          - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
            value: default
          - name: AZURE_SEARCH_IDENTIFIER_FIELD
            value: chunk_id
          - name: AZURE_SEARCH_CONTENT_FIELD
            value: chunk
          - name: AZURE_SEARCH_EMBEDDING_FIELD
            value: text_vector
          - name: AZURE_SEARCH_TITLE_FIELD
            value: title
          - name: AZURE_SEARCH_USE_VECTOR_QUERY
            value: 'True'
          envFromSecretRefs:
          - voicerag-openai-endpoint
          - voicerag-openai-api-key
          - azure-search-endpoint
          - azure-search-api-key
          - azure-search-index
          - azure-storage-account-name
          - azure-storage-account-key
          - azure-storage-container
          - azure-storage-connection-string
          - application-insights-instrumentation-key
          resources:
            cpu: '1'
            memory: 2Gi
          autoscaling:
            minReplicas: 1
            maxReplicas: 10
            policy:
              metric: cpu
              target: 70
        endpoints:
        - name: http
          port: 8000
          exposure: public
          protocol: http
          path: /
    deployments:
    - name: azure-container-apps-gpt4-mini
      target:
        provider: azure
        region: eastus2
        tdfRef: azure-east-vr-alt
        cluster: voicerag-alt-aca-env
        namespace: voicerag-alt
      identityRef: azure-managed-identity://voicerag
      secretStores:
        primary: wdf-secret-manager
      components:
      - voicerag-backend
      overrides:
        components:
          voicerag-backend:
            runtime:
              image:
                registry: uvvoiceragacr.azurecr.io
                repository: uv-voicerag-app
                tag: latest
              env:
              - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
                value: gpt-realtime-mini
              - name: AZURE_OPENAI_CHAT_DEPLOYMENT
                value: gpt-4.1-nano
              - name: AZURE_OPENAI_API_VERSION
                value: 2025-04-01-preview
